AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Portfolio site (private S3 + CloudFront OAC) with a Lambda API, API key, DynamoDB, and an EventBridge schedule.

Parameters:
  ApiKeyParameterName:
    Type: String
    Default: /portfolio/api-key
    Description: Systems Manager Parameter Store name holding the API key value. Create it with scripts/bootstrap.sh before the first deploy.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128

Resources:
  # ---------- Website: private bucket, served only through CloudFront ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} portfolio"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${PortfolioApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: /Prod
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            # CloudFront adds the key, so the browser never sees it.
            OriginCustomHeaders:
              - HeaderName: x-api-key
                HeaderValue: !Sub "{{resolve:ssm:${ApiKeyParameterName}}}"
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        # A private S3 origin answers 403 for a missing file; show the 404 page instead.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  # ---------- Backend: API Gateway (API key required) -> Lambda -> DynamoDB ----------
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  PortfolioApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        ApiKeyRequired: true
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: "*"
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          SYMBOLS: AMZN,NVDA,AAPL
          ALPACA_KEY_PARAM: /portfolio/alpaca-key-id
          ALPACA_SECRET_PARAM: /portfolio/alpaca-secret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        # Read (and decrypt) the Alpaca keys from Parameter Store at runtime.
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameter, ssm:GetParameters]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio/alpaca-*"
      Events:
        Visit:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /api/visit
            Method: POST
        Visits:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /api/visits
            Method: GET
        Quotes:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /api/quotes
            Method: GET
        Stats:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /api/stats
            Method: GET
        Contact:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /api/contact
            Method: POST
        # EventBridge rule: every 15 minutes, fetch fresh stock quotes into DynamoDB.
        QuotesRefresh:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: Refresh Alpaca stock quotes
            Input: '{"task": "refresh_quotes"}'
        # EventBridge rule: once a day, freeze the totals into a STATS#<date> item.
        DailySnapshot:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Description: Daily visitor and message snapshot

  # ---------- API key (value lives in Parameter Store, not in this repo) ----------
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: PortfolioApiProdStage
    Properties:
      Enabled: true
      Value: !Sub "{{resolve:ssm:${ApiKeyParameterName}}}"
      StageKeys:
        - RestApiId: !Ref PortfolioApi
          StageName: Prod

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: PortfolioApiProdStage
    Properties:
      ApiStages:
        - ApiId: !Ref PortfolioApi
          Stage: Prod
      Throttle:
        BurstLimit: 10
        RateLimit: 5
      Quota:
        Limit: 10000
        Period: DAY

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  TableName:
    Value: !Ref Table
